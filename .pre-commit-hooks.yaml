- id: check-spdx-header
  name: check-spdx-header
  description: Ensure spec files start with the required SPDX copyright and license header.
  entry: check-spdx-header
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-structure
  name: check-spec-structure
  description: Ensure spec files contain all required header fields in canonical order and sections separated by blank lines.
  entry: check-spec-structure
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-name
  name: check-spec-name
  description: Ensure the spec file Name field follows the openRuyi naming guidelines (lowercase, hyphen separator, no ABI/version encoded).
  entry: check-spec-name
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-version
  name: check-spec-version
  description: Ensure the spec file Version field follows the openRuyi versioning guidelines (dots for separators, ~ for prereleases, snapshot format for VCS revisions).
  entry: check-spec-version
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-release
  name: check-spec-release
  description: Ensure the spec file Release field follows the openRuyi guidelines (%autorelease, integer revision starting at 1, no hardcoded dist suffix or dist override).
  entry: check-spec-release
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-summary
  name: check-spec-summary
  description: Ensure the spec file Summary field follows the openRuyi guidelines (short English description, no trailing English period).
  entry: check-spec-summary
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-license
  name: check-spec-license
  description: Ensure the spec file License field uses valid SPDX identifiers or expressions (uppercase AND/OR/WITH operators, no comma separators, no legacy + suffix).
  entry: check-spec-license
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-url
  name: check-spec-url
  description: Ensure the spec file URL field is a valid http(s) website or source repository link and is not built with macros such as %{name}.
  entry: check-spec-url
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-source
  name: check-spec-source
  description: Ensure network Source lines carry a #!RemoteAsset marker with a sha256 checksum and SourceForge links use downloads.sourceforge.net.
  entry: check-spec-source
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-vcs
  name: check-spec-vcs
  description: "Ensure the spec file VCS field is a cloneable source repository link (git scheme or http(s) link to a source-code hosting platform), or uses the exact \"# VCS: No VCS link available\" comment when no link exists."
  entry: check-spec-vcs
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-buildarch
  name: check-spec-buildarch
  description: Ensure the spec file BuildArch field declares a target architecture (noarch), is located between the last Source field and the BuildSystem field, and is not empty.
  entry: check-spec-buildarch
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-buildsystem
  name: check-spec-buildsystem
  description: Ensure the spec file BuildSystem field uses a known build system (or a newly added value) and, when empty, explains the reason in a comment.
  entry: check-spec-buildsystem
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
