repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: debug-statements
    -   id: name-tests-test
    -   id: requirements-txt-fixer
-   repo: https://github.com/asottile/reorder-python-imports
    rev: v3.17.0
    hooks:
    -   id: reorder-python-imports
        args: [--py310-plus, --add-import, 'from __future__ import annotations']
-   repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
    -   id: add-trailing-comma
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py310-plus]
-   repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
    -   id: autopep8
-   repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
    -   id: flake8
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
    -   id: mypy
        additional_dependencies: [types-PyYAML]
-   repo: local
    hooks:
    -   id: check-spdx-header
        name: check-spdx-header
        description: Ensure spec files start with the required SPDX header.
        entry: check-spdx-header
        language: python
        types_or: [spec]

    -   id: check-spec-structure
        name: check-spec-structure
        description: Ensure spec files contain all required header fields in canonical order and sections separated by blank lines.
        entry: check-spec-structure
        language: python
        types_or: [spec]

    -   id: check-spec-name
        name: check-spec-name
        description: Ensure the spec file Name field follows the openRuyi naming guidelines (lowercase, hyphen separator, no ABI/version encoded).
        entry: check-spec-name
        language: python
        types_or: [spec]

    -   id: check-spec-version
        name: check-spec-version
        description: Ensure the spec file Version field follows the openRuyi versioning guidelines (dots for separators, ~ for prereleases, snapshot format for VCS revisions).
        entry: check-spec-version
        language: python
        types_or: [spec]
