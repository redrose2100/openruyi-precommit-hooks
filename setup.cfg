[metadata]
name = openruyi-precommit-hooks
version = 0.1.0
description = Some out-of-the-box hooks for pre-commit (openruyi edition).
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/redrose2100/openruyi-precommit-hooks
author = redrose2100
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython

[options]
packages = find:
install_requires =
    pyyaml>=6.0
python_requires = >=3.10

[options.packages.find]
exclude =
    tests*
    testing*

[options.entry_points]
console_scripts =
    check-ast = openruyi_precommit_hooks.check_ast:main
    check-executables-have-shebangs = openruyi_precommit_hooks.check_executables_have_shebangs:main
    check-yaml = openruyi_precommit_hooks.check_yaml:main
    require-ascii = openruyi_precommit_hooks.require_ascii:main
    trailing-whitespace-fixer = openruyi_precommit_hooks.trailing_whitespace_fixer:main

[bdist_wheel]
universal = True

[mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[mypy-testing.*]
disallow_untyped_defs = false

[mypy-tests.*]
disallow_untyped_defs = false
