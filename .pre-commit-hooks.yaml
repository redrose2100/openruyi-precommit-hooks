- id: check-spdx-header
  name: check-spdx-header
  description: Ensure spec files start with the required SPDX copyright and license header.
  entry: check-spdx-header
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-structure
  name: check-spec-structure
  description: Ensure spec files contain all required header fields in canonical order and sections separated by blank lines.
  entry: check-spec-structure
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-name
  name: check-spec-name
  description: Ensure the spec file Name field follows the openRuyi naming guidelines (lowercase, hyphen separator, no ABI/version encoded).
  entry: check-spec-name
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-version
  name: check-spec-version
  description: Ensure the spec file Version field follows the openRuyi versioning guidelines (dots for separators, ~ for prereleases, snapshot format for VCS revisions).
  entry: check-spec-version
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-release
  name: check-spec-release
  description: Ensure the spec file Release field follows the openRuyi guidelines (%autorelease, integer revision starting at 1, no hardcoded dist suffix or dist override).
  entry: check-spec-release
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-summary
  name: check-spec-summary
  description: Ensure the spec file Summary field follows the openRuyi guidelines (short English description, no trailing English period).
  entry: check-spec-summary
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-license
  name: check-spec-license
  description: Ensure the spec file License field uses valid SPDX identifiers or expressions (uppercase AND/OR/WITH operators, no comma separators, no legacy + suffix).
  entry: check-spec-license
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-url
  name: check-spec-url
  description: Ensure the spec file URL field is a valid http(s) website or source repository link and is not built with macros such as %{name}.
  entry: check-spec-url
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-source
  name: check-spec-source
  description: Ensure network Source lines carry a #!RemoteAsset marker with a sha256 checksum and SourceForge links use downloads.sourceforge.net.
  entry: check-spec-source
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-vcs
  name: check-spec-vcs
  description: "Ensure the spec file VCS field is a cloneable source repository link (git scheme or http(s) link to a source-code hosting platform), or uses the exact \"# VCS: No VCS link available\" comment when no link exists."
  entry: check-spec-vcs
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true

- id: check-spec-buildarch
  name: check-spec-buildarch
  description: Ensure the spec file BuildArch field declares a target architecture (noarch), is located between the last Source field and the BuildSystem field, and is not empty.
  entry: check-spec-buildarch
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-buildsystem
  name: check-spec-buildsystem
  description: Ensure the spec file BuildSystem field uses a known build system (or a newly added value) and, when empty, explains the reason in a comment.
  entry: check-spec-buildsystem
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-buildoption
  name: check-spec-buildoption
  description: Ensure the spec file BuildOption fields follow the openRuyi guidelines (stage name required, two spaces before arguments, located between BuildSystem and BuildRequires, written in build/install/check order).
  entry: check-spec-buildoption
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-buildrequires
  name: check-spec-buildrequires
  description: Ensure the spec file BuildRequires fields follow the openRuyi guidelines (declare exactly one dependency per line, no empty values).
  entry: check-spec-buildrequires
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-requires
  name: check-spec-requires
  description: Ensure the spec file Requires fields follow the openRuyi guidelines (declare exactly one runtime dependency per line, no empty values).
  entry: check-spec-requires
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-patch
  name: check-spec-patch
  description: Ensure the spec file Patch fields follow the openRuyi patch guidelines (comment above each Patch, four-digit numeric prefix in 0001-2999, %patchlist for more than 3 patches, placed between BuildSystem and BuildOption/BuildRequires).
  entry: check-spec-patch
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-files
  name: check-spec-files
  description: Ensure the spec file %files sections follow the openRuyi guidelines (%license for license text, %doc for documentation, no duplicate entries, no .la archives, no %{_datadir}/locale/* wildcards).
  entry: check-spec-files
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-changelog
  name: check-spec-changelog
  description: Ensure the spec file %changelog section content is %autochangelog (no handwritten changelog entries).
  entry: check-spec-changelog
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-bcond
  name: check-spec-bcond
  description: Ensure the spec file declares conditional-build switches with %bcond (no legacy %bcond_with/%bcond_without, and no %{with}/%{without} references to undeclared switches).
  entry: check-spec-bcond
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-autotools
  name: check-spec-autotools
  description: Ensure spec files using the autotools build system declare the required autoconf, automake, libtool and make BuildRequires.
  entry: check-spec-autotools
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-cmake
  name: check-spec-cmake
  description: Ensure spec files using the cmake build system declare the required cmake BuildRequires.
  entry: check-spec-cmake
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-golang
  name: check-spec-golang
  description: Ensure spec files using the golang or golangmodules build system declare the required go and go-rpm-macros BuildRequires.
  entry: check-spec-golang
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
- id: check-spec-meson
  name: check-spec-meson
  description: Ensure spec files using the meson build system declare the required meson BuildRequires.
  entry: check-spec-meson
  language: python
  types_or: [spec]
  # Only check staged files; skip if nothing changed.
  pass_filenames: true
